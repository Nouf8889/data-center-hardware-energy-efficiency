services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-center-airflow:local
    container_name: data-center-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../dbt_project:/opt/airflow/dbt_project
      - ./checks:/opt/airflow/checks
      - ${HOME}/.dbt:/home/airflow/.dbt:ro
      - ./credentials/application_default_credentials.json:/home/airflow/.config/gcloud/application_default_credentials.json:ro
    restart: "no"
